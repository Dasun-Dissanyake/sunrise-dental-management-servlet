<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunrise Dental - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 380px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #1976d2;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #125ea7;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>Sunrise Dental</h1>

    <p class="subtitle">
        Staff Management System
    </p>

    <form action="../login" method="post">

        <label for="username">
            Username
        </label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
        >

        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
