<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic - Management System</title>
    <link rel="stylesheet" href="css/sunrise-theme.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-warm);">

    <div style="background: white; border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 48px 40px; max-width: 480px; width: 100%; text-align: center;">
        <img
            src="assets/images/sunrise-dental-logo.png"
            alt="Sunrise Dental Logo"
            style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 20px;"
        >
        <h1 style="font-size: 26px; font-weight: 800; color: var(--dark); margin-bottom: 6px; letter-spacing: -0.5px;">
            Sunrise Dental
        </h1>
        <p style="font-size: 15px; color: var(--muted); margin-bottom: 28px;">
            Professional Dental Clinic Management System
        </p>

        <div style="padding: 16px; background: var(--surface-secondary); border-radius: var(--radius-md); border: 1px solid var(--border-light); margin-bottom: 28px; font-size: 14px; color: var(--text-dark);">
            <div style="font-weight: 700; color: var(--success); margin-bottom: 4px;">System Operational</div>
            Clinic database, scheduling, and billing engines are online.
        </div>

        <a href="pages/login.html" class="btn btn-primary" style="display: block; width: 100%; padding: 14px 20px; font-size: 15px; font-weight: 700; text-decoration: none; box-sizing: border-box;">
            Go to Login Portal &rarr;
        </a>
    </div>

</body>
</html>
